name: Capturas reais do MVP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/capturar_evidencias.py
      - static/js/acessibilidade.js
      - static/css/estilo.css
      - templates/base.html
      - .github/workflows/capturas-reais.yml

jobs:
  capturas:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "chave-apenas-para-capturas-automatizadas-no-github-actions"
      DB_ENGINE: sqlite
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências Django e Playwright
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "playwright>=1.55,<2"
          python -m playwright install chromium
      - name: Preparar banco de demonstração
        run: |
          python manage.py check
          python manage.py migrate --noinput
      - name: Abrir aplicação real e capturar telas no navegador
        run: python scripts/capturar_evidencias.py
      - name: Publicar capturas reais como artefato
        uses: actions/upload-artifact@v4
        with:
          name: tres-telas-reais-do-mvp
          path: evidencias_reais/*.png
          if-no-files-found: error
