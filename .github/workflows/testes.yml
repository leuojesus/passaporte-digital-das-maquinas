name: Testes e cobertura Django
on:
  push:
    branches: [main]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "chave-apenas-para-os-testes-do-github-actions-nao-utilizar-em-producao"
      DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências e coverage
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "coverage>=7,<9"
      - name: Validar Django e migrações
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Executar testes e medir cobertura
        run: |
          python -m coverage run --source=inventario manage.py test --verbosity=2
          python -m coverage report -m
          python -m coverage xml -o coverage.xml
      - name: Salvar relatório de cobertura
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-de-testes
          path: coverage.xml
