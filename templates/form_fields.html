{% for field in form %}
<div class="mb-3"><label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}{% if field.field.required %} <span class="required" aria-label="obrigatório">*</span>{% endif %}</label>
{{ field }}
{% if field.errors %}<div class="field-error" role="alert">{{ field.errors }}</div>{% endif %}
</div>
{% endfor %}
{% if form.non_field_errors %}<div class="field-error" role="alert">{{ form.non_field_errors }}</div>{% endif %}
